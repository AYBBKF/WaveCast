{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Mot de passe oublié</h1>
  <p class="muted">Indiquez l'adresse e-mail de votre compte : vous recevrez un lien sécurisé pour choisir un nouveau mot de passe.</p>
  <form method="post" class="form">{% csrf_token %}
    {% include "partials/form.html" %}
    <button class="btn btn-primary" type="submit">Recevoir le lien</button>
  </form>
</div>
{% endblock %}
