{% extends "base.html" %}
{% block title %}Se connecter{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Se connecter</h1>
  <form method="post" class="form">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "partials/form.html" %}
    <button class="btn btn-primary" type="submit">Se connecter</button>
  </form>
  <p class="small center" style="margin-top:14px"><a href="{% url 'password_reset' %}">Mot de passe oublié ?</a> · <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Créer un compte</a></p>
</div>
{% endblock %}
