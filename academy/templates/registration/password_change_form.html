{% extends "base.html" %}
{% block title %}Changer de mot de passe{% endblock %}
{% block content %}
<div class="card auth-card"><h1>Changer de mot de passe</h1>
<form method="post" class="form">{% csrf_token %}
{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
<button class="btn btn-primary" type="submit">Enregistrer</button></form></div>
{% endblock %}
