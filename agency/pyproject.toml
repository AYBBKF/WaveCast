[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoshorts"
version = "1.0.0"
description = "Agence IA autonome de production de YouTube Shorts historiques (Opus directeur + 10 agents Haiku)."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
edge = ["edge-tts>=6.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
chronoshorts = "chronoshorts.cli:main"

[tool.setuptools.packages.find]
include = ["chronoshorts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
